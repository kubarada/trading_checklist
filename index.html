<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Trading Checklist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <img src="assets/logo.png" alt="Trading Checklist Logo" class="logo">
        <span class="app-name">Trading Checklist</span>
    </div>

    <div class="topbar-right" id="currentDate"></div>
</header>


<main>
    <div id="app"></div>
</main>

<footer class="footer">
    <span>© 2026 Trading Checklist™</span>
    <span>Author: Jakub Rada</span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>

<script>
    const el = document.getElementById('currentDate');

    function updateDateTime() {
        const now = new Date();
        el.textContent = now.toLocaleString('cs-CZ', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
</script>
